<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Youth Justice NT{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            margin: 0;
            padding: 0;
            color: #1c3553;
        }

        header {
            background: linear-gradient(
                to right,
                #1e3a5f 0%,
                #2b5d8a 25%,
                #3f78a8 50%,
                #2b5d8a 75%,
                #1e3a5f 100%
            );
            color: white;
            padding: 25px 0;
            text-align: center;
            box-shadow: 0 6px 20px rgba(30, 58, 95, 0.25);
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 1px;
        }

        header p {
            margin-top: 8px;
            font-size: 14px;
            opacity: 0.95;
        }

        .navbar {
            margin-top: 15px;
        }

        .navbar a {
            display: inline-block;
            margin: 0 15px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .container {
            width: 85%;
            margin: 30px auto;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <h1>Youth Justice NT</h1>
        <p>Supporting youth diversion and community programs across the Northern Territory</p>
        <div class="navbar">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'programs' %}">Programs</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'manage_programs' %}">Manage Programs</a>
            <a href="/admin/">Admin</a>
        </div>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
