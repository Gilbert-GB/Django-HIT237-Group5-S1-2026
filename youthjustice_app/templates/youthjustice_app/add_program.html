<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Program | Youth Justice NT</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(
                to right,
                #1e3a5f 0%,
                #2b5d8a 25%,
                #3f78a8 50%,
                #2b5d8a 75%,
                #1e3a5f 100%
            );
            color: white;
            padding: 25px 0;
            text-align: center;
            box-shadow: 0 6px 20px rgba(30, 58, 95, 0.25);
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 1px;
        }

        header p {
            margin-top: 8px;
            font-size: 14px;
            opacity: 0.95;
        }

        .navbar {
            margin-top: 15px;
        }

        .navbar a {
            display: inline-block;
            margin: 0 15px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .container {
            width: 85%;
            margin: 30px auto;
        }

        .form-card {
            background: linear-gradient(180deg, #ffffff, #f9fcff);
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(70, 130, 180, 0.12);
            border: 1px solid rgba(70, 130, 180, 0.12);
        }

        .form-card h2 {
            margin-top: 0;
            color: #1c3553;
            font-size: 28px;
        }

        form p {
            margin-bottom: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 5px;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            background-color: #2f6fa3;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #1c3553;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 18px;
            text-decoration: none;
            color: #2f6fa3;
            font-weight: 600;
        }
    </style>
</head>

<body>

<header>
    <h1>Youth Justice NT</h1>
    <p>Supporting youth diversion and community programs across the Northern Territory</p>

    <div class="navbar">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'programs' %}">Programs</a>
        <a href="{% url 'about' %}">About</a>
        <a href="/admin/">Admin</a>
    </div>
</header>

<div class="container">

    <a href="{% url 'programs' %}" class="back-link">← Back to Programs</a>

    <div class="form-card">
        <h2>Add New Program</h2>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Submit Program</button>
        </form>
    </div>

</div>

</body>
</html>
