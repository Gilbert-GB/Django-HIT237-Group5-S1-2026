<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Youth Justice NT</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: Arial; background:#f4f7fb; margin:0; }
        header { background:#1e3a5f; color:white; padding:20px; text-align:center; }

        .container { width:85%; margin:auto; padding:20px; }

        .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }

        .card { background:white; padding:20px; border-radius:10px; margin-bottom:20px; }

        .kpi { font-size:24px; font-weight:bold; }

        select { padding:8px; margin:10px 5px; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(
                to right,
                #1e3a5f 0%,
                #2b5d8a 25%,
                #3f78a8 50%,
                #2b5d8a 75%,
                #1e3a5f 100%
            );
            color: white;
            padding: 25px 0;
            text-align: center;
            box-shadow: 0 6px 20px rgba(30, 58, 95, 0.25);
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 1px;
        }

        header p {
            margin-top: 8px;
            font-size: 14px;
            opacity: 0.95;
        }

        .navbar {
            margin-top: 15px;
        }

        .navbar a {
            display: inline-block;
            margin: 0 15px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .container {
            width: 85%;
            margin: 30px auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: linear-gradient(180deg, #ffffff, #f9fcff);
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(70, 130, 180, 0.12);
            border: 1px solid rgba(70, 130, 180, 0.12);
            text-align: center;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 30px;
            color: #2f6fa3;
        }

        .stat-card p {
            margin-top: 10px;
            color: #4a5a6a;
            font-weight: 600;
            font-size: 14px;
        }

        h2 {
            color: #1e3a5f;
            margin-top: 40px;
            margin-bottom: 18px;
        }

        .program-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
        }

        .program-card {
            background: linear-gradient(180deg, #ffffff, #f9fcff);
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(70, 130, 180, 0.12);
            border: 1px solid rgba(70, 130, 180, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .program-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(70, 130, 180, 0.18);
        }

        .program-card h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 20px;
            line-height: 1.4;
        }

        .program-card h3 a {
            text-decoration: none;
            color: #1c3553;
        }

        .program-card h3 a:hover {
            color: #4682B4;
        }

        .program-card p {
            margin: 9px 0;
            color: #334;
            line-height: 1.6;
            font-size: 14px;
        }

        .program-card a {
            display: inline-block;
            margin-top: 14px;
            text-decoration: none;
            color: #2f6fa3;
            font-weight: 600;
        }

        .program-card a:hover {
            color: #1c3553;
        }

        .status-badge {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: 0.3px;
        }

        .available {
            background-color: #e6f7ec;
            color: #1f7a36;
            border: 1px solid #cdeed8;
        }

        .unavailable {
            background-color: #fdeced;
            color: #a12634;
            border: 1px solid #f7cfd4;
        }

        .hero-card {
            background: linear-gradient(180deg, #ffffff, #f9fcff);
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(70, 130, 180, 0.12);
            border: 1px solid rgba(70, 130, 180, 0.12);
            margin-top: 35px;
            text-align: center;
        }

        .hero-card h2 {
            margin-top: 0;
            color: #1c3553;
        }

        .hero-card p {
            color: #334;
            line-height: 1.7;
            font-size: 15px;
        }

        .hero-button {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 20px;
            background-color: #2f6fa3;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
        }

        .hero-button:hover {
            background-color: #1f5c8e;
        }

        .empty-message {
            background: white;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 8px 18px rgba(70, 130, 180, 0.08);
            border: 1px solid rgba(70, 130, 180, 0.10);
        }
    </style>
</head>

<body>
    <header>
        <h1>Youth Justice NT</h1>
        <p>Supporting youth diversion and community programs across the Northern Territory</p>

        <div class="navbar">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'programs' %}">Programs</a>
            <a href="{% url 'about' %}">About</a>
            <a href="/admin/">Admin</a>
        </div>
    </header>


<div class="container">

    <!-- FILTERS -->
    <select id="regionFilter">
        <option value="">All Regions</option>
        <option value="Darwin">Darwin</option>
        <option value="Alice Springs">Alice Springs</option>
        <option value="Katherine">Katherine</option>
    </select>

    <select id="yearFilter">
        <option value="">All Years</option>
        <option value="2023">2023</option>
        <option value="2024">2024</option>
        <option value="2025">2025</option>
    </select>

    <!-- KPI -->
    <div class="grid">
        <div class="card">
            Total Crimes
            <div class="kpi" id="total-crimes">-</div>
        </div>

        <div class="card">
            Top Region
            <div class="kpi" id="top-region">-</div>
        </div>

        <div class="card">
            Top Crime
            <div class="kpi" id="top-crime">-</div>
        </div>
    </div>

    <!-- LINE CHART -->
    <div class="card">
        <h3>Monthly Trend</h3>
        <canvas id="lineChart"></canvas>
    </div>

    <!-- BAR CHART -->
    <div class="card">
        <h3>Top Regions</h3>
        <canvas id="barChart"></canvas>
    </div>

    <!-- PIE CHART -->
    <div class="card">
        <h3>Crime Categories</h3>
        <canvas id="pieChart"></canvas>
    </div>

</div>

<script>
let lineChart, barChart, pieChart;

function loadDashboard() {

    const region = document.getElementById("regionFilter").value;
    const year = document.getElementById("yearFilter").value;

    let url = "/api/dashboard/?";

    if (region) url += "region=" + region + "&";
    if (year) url += "year=" + year;

    fetch(url)
    .then(res => res.json())
    .then(data => {

        // KPIs
        document.getElementById("total-crimes").innerText = data.kpis.total_crimes;
        document.getElementById("top-region").innerText = data.kpis.top_region?.region || "-";
        document.getElementById("top-crime").innerText = data.kpis.top_crime?.offence_type || "-";

        // LINE
        const labels = data.charts.monthly_trend.map(x => `${x.year}-${x.month}`);
        const values = data.charts.monthly_trend.map(x => x.total_crimes);

        if (lineChart) lineChart.destroy();
        lineChart = new Chart(document.getElementById("lineChart"), {
            type: "line",
            data: { labels, datasets: [{ data: values }] }
        });

        // BAR
        const rLabels = data.charts.top_regions.map(x => x.region);
        const rValues = data.charts.top_regions.map(x => x.total);

        if (barChart) barChart.destroy();
        barChart = new Chart(document.getElementById("barChart"), {
            type: "bar",
            data: { labels: rLabels, datasets: [{ data: rValues }] }
        });

        // PIE
        const pLabels = data.charts.category_breakdown.map(x => x.offence_category);
        const pValues = data.charts.category_breakdown.map(x => x.total);

        if (pieChart) pieChart.destroy();
        pieChart = new Chart(document.getElementById("pieChart"), {
            type: "pie",
            data: { labels: pLabels, datasets: [{ data: pValues }] }
        });

    });
}

// events
document.getElementById("regionFilter").addEventListener("change", loadDashboard);
document.getElementById("yearFilter").addEventListener("change", loadDashboard);

// init
loadDashboard();
</script>

</body>
</html>
