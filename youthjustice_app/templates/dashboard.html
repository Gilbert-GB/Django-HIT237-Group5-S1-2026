<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Youth Justice NT</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(
                to right,
                #1e3a5f 0%,
                #2b5d8a 25%,
                #3f78a8 50%,
                #2b5d8a 75%,
                #1e3a5f 100%
            );
            color: white;
            padding: 25px 0;
            text-align: center;
            box-shadow: 0 6px 20px rgba(30, 58, 95, 0.25);
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin-top: 8px;
            font-size: 14px;
            opacity: 0.95;
        }

        .navbar {
            margin-top: 15px;
        }

        .navbar a {
            display: inline-block;
            margin: 0 15px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .container {
            width: 85%;
            margin: 30px auto;
        }

        .card {
            background: linear-gradient(180deg, #ffffff, #f9fcff);
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(70, 130, 180, 0.12);
            border: 1px solid rgba(70, 130, 180, 0.12);
            margin-bottom: 20px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .kpi-title {
            font-size: 14px;
            color: #666;
        }

        .kpi-value {
            font-size: 26px;
            font-weight: bold;
            color: #1c3553;
        }

        canvas {
            max-width: 100%;
        }
    </style>
</head>

<body>

<header>
    <h1>Youth Justice NT</h1>
    <p>Supporting youth diversion and community programs across the Northern Territory</p>

    <div class="navbar">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'programs' %}">Programs</a>
        <a href="{% url 'about' %}">About</a>
        <a href="/admin/">Admin</a>
    </div>
</header>

<div class="container">

    <!-- KPI SECTION -->
    <div class="kpi-grid">

        <div class="card">
            <div class="kpi-title">Total Crimes</div>
            <div class="kpi-value" id="total-crimes">Loading...</div>
        </div>

        <div class="card">
            <div class="kpi-title">Top Region</div>
            <div class="kpi-value" id="top-region">Loading...</div>
        </div>

        <div class="card">
            <div class="kpi-title">Top Crime Type</div>
            <div class="kpi-value" id="top-crime">Loading...</div>
        </div>

    </div>

    <!-- CHART -->
    <div class="card">
        <h3>Monthly Crime Trend</h3>
        <canvas id="monthlyChart"></canvas>
    </div>

</div>

<script>
fetch("/api/dashboard/")
    .then(res => res.json())
    .then(data => {

        // KPIs
        document.getElementById("total-crimes").innerText =
            data.kpis.total_crimes;

        document.getElementById("top-region").innerText =
            data.kpis.top_region?.region || "N/A";

        document.getElementById("top-crime").innerText =
            data.kpis.top_crime?.offence_type || "N/A";

        // Chart data
        const labels = data.charts.monthly_trend.map(x =>
            `${x.year}-${String(x.month).padStart(2,'0')}`
        );

        const values = data.charts.monthly_trend.map(x => x.total_crimes);

        new Chart(document.getElementById("monthlyChart"), {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Crime Trend",
                    data: values,
                    borderWidth: 2,
                    tension: 0.3
                }]
            }
        });

    })
    .catch(err => console.log(err));
</script>

</body>
</html>
